<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>INDEX001</title>
    </head>
    <body>
        <!-- h1은 제일 큰 제목, h6은 제일 작은 제목. 둘 다 "같은 문장"으로 크기 차이를 비교해보는 예시예요. -->
        <h1>This page is INDEX001.</h1>
        <h6>This page is INDEX001.</h6>

        <!-- 이미지는 width(가로 크기)만 정해서, 세로는 원본 비율대로 자동으로 맞춰져요. -->
        <img src="./res/img/apple.jpg" width="300">
        <br>
        <!-- controls만 있고 autoplay는 없어서, 자동 재생 없이 사용자가 직접 재생버튼을 눌러야 해요. -->
        <video width="400" controls>
            <source src="./res/mov/apple.mp4" type="video/mp4">
        </video>

        <!-- 순서 없는 목록(점 기호) -->
        <ul>
            <li>메뉴001</li>
            <li>메뉴002</li>
            <li>메뉴003</li>
            <li>메뉴004</li>
        </ul>

        <!-- 순서 있는 목록(숫자) -->
        <ol>
            <li>menu001</li>
            <li>menu002</li>
            <li>menu003</li>
            <li>menu004</li>
        </ol>

        <!-- 용어(dt) - 설명(dd) 짝을 이루는 목록 -->
        <dl>
            <dt>메뉴판</dt>
            <dd>메뉴001</dd>
            <dd>메뉴002</dd>
            <dd>메뉴003</dd>
            <dd>메뉴004</dd>
        </dl>

        <!-- form(양식) 태그: 회원가입 입력폼 예시 -->
        <form action="서버URL" method="post" name="signupform">
            <input type="text" placeholder="INPUT ID"> <br>
            <!-- password: 입력값이 ●●●로 가려짐 -->
            <input type="password" placeholder="INPUT PW"> <br>
            <!-- email: 이메일 형식인지 브라우저가 자동으로 확인해줌 -->
            <input type="email" placeholder="INPUT MAIL"> <br>
            국가선택
            <!-- select+option: 드롭다운으로 하나를 선택 -->
            <select>
                <option>한국</option>
                <option>일본</option>
                <option>중국</option>
            </select> <br>
            <!-- checkbox: 여러 개 동시에 선택 가능 -->
            취미:
                야구<input type="checkbox">
                농구<input type="checkbox">
                배구<input type="checkbox">
                축구<input type="checkbox"> <br>
            <!-- radio: name이 같은 것끼리 묶여서 하나만 선택 가능 -->
            성구분:
                남<input type="radio" name="gender">
                여<input type="radio" name="gender"> <br>
            날짜: <input type="date"> <br>
            날짜시간: <input type="datetime-local"> <br>
            색상: <input type="color"> <br>
            <!-- range: 슬라이더 바를 드래그해서 값을 고름. min~max 범위 안에서 step 간격으로 움직여요. -->
            범위: <input type="range" min="0" max="100" value="0" step="10"> <br>
            <!-- submit: 서버로 전송 / reset: 입력값 초기화 -->
            <input type="submit" value="회원가입">
            <input type="reset" value="초기화">
        </form>
    </body>
</html>
