<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form(양식) 태그</title>
</head>
<body>

    <!--
        form(양식) 태그: 사용자가 입력한 값을 서버로 보낼 때 쓰는 큰 틀이에요.
        action: 입력값을 어디(어떤 주소)로 보낼지
        method: 어떤 방식(post/get)으로 보낼지
        name: 이 폼(양식)의 이름
    -->
    <form
        action="http://192.168.0.105/newmember/sign-up"
        method="post"
        name="signupform">
        <!-- type="text": 한 줄짜리 일반 글자 입력창. placeholder는 아무것도 안 썼을 때 보이는 흐린 안내 문구예요. -->
        <input type="text" placeholder="회원 ID 입력">
        <br>
        <input type="text" placeholder="회원 NAME 입력">
        <br>
        <!-- type="password": 입력한 글자가 화면에 ●●●처럼 가려져서 보여요. -->
        <input type="password" placeholder="회원 PW 입력">
        <br>
        <input type="text" placeholder="회원 PHONE 입력">
        <br>
        <!-- type="email": 이메일 형식(@포함)인지 브라우저가 자동으로 검사해줘요. -->
        <input type="email" placeholder="회원 MAIL 입력">
        <br>
        <!-- type="number": 숫자만 입력 가능. min/max로 입력 가능한 범위를 정하고, value로 처음 값을 정해요. -->
        <input type="number" value="10" min="1" max="20" placeholder="회원 AGE 입력">
        <br>
        <!-- type="color": 클릭하면 색상 선택 팔레트가 떠요. value는 처음에 선택되어 있을 색상값. -->
        좋아하는 색상: <input type="color" value="#0000FF">
        <br>
        <!-- type="date": 클릭하면 달력이 떠서 날짜를 고를 수 있어요. -->
        생일: <input type="date">
        <br>
        <!-- type="datetime-local": 날짜 + 시간을 함께 고를 수 있어요. -->
        공부하고싶은날짜시간: <input type="datetime-local">
        <br>
        <!-- select + option: 여러 선택지 중 하나를 고르는 드롭다운(선택) 메뉴예요. -->
        당신 국가:
        <select>
            <option>대한민국</option>
            <option>미국</option>
            <option>일본</option>
            <option>중국</option>
            <option>영국</option>
        </select>
        <br>
        <!-- type="checkbox": 여러 개를 동시에 선택할 수 있어요(예: 좋아하는 운동 여러 개 체크). -->
        취미: 축구:<input type="checkbox"> 농구:<input type="checkbox"> 야구:<input type="checkbox"> 배구:<input type="checkbox">
        <br>
        <!-- type="radio": name값이 같은 것끼리 묶여서, 그 그룹 안에서는 딱 하나만 선택돼요. -->
        성구분:
        남:<input type="radio" name="gender">
        여<input type="radio" name="gender">
        남여<input type="radio" name="gender">
        <br>
        직업:
        학생:<input type="radio" name="job">
        회사원:<input type="radio" name="job">
        자영업:<input type="radio" name="job">
        백수:<input type="radio" name="job">
        은퇴:<input type="radio" name="job">
        <!-- 아래 두 줄처럼 button이나 input[type=button]으로도 버튼을 만들 수 있지만, 지금은 안 쓰기로 하고 주석 처리해뒀어요. -->
        <!-- <button>회원가입</button> -->
        <!-- <input type="button" value="회원가입"> -->
        <br>
        <!-- type="submit": 폼에 입력한 내용을 서버로 전송해요. type="reset": 입력한 내용을 전부 지우고 처음 상태로 되돌려요. -->
        <input type="submit" value="회원가입"> <input type="reset" value="초기화">
    </form>

    <br><br>

    <!-- 로그인용 폼도 똑같은 방식으로, 아이디/비밀번호/한줄평(textarea) 입력받고 로그인 버튼으로 전송해요. -->
    <form
        action="http://192.168.0.105/newmember/sign-up"
        method="post"
        name="signinform">
        <input type="text" placeholder="user id">
        <br>
        <input type="text" placeholder="user pw">
        <br>
        <!-- textarea: 여러 줄을 입력할 수 있는 넓은 입력창. rows=세로 줄 수, cols=가로 글자 수 -->
        <textarea rows="5" cols="100"></textarea>
        <br>
        <input type="submit" value="로그인">
    </form>

</body>
</html>
