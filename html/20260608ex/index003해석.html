<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>리스ㅌ~~~~~ㅡ</title>
</head>
<body>
    <!-- 목록(리스트) 관련 태그. 메뉴판, 순서, 용어 설명처럼 "여러 개를 나열"할 때 써요. -->

    <!-- 순서 없는 목록(ul): 앞에 점(•) 같은 기호만 붙고, 순서 자체는 중요하지 않을 때 사용해요. -->
    <h2>메뉴판</h2>
    <ul>
        <li>자장면 7,000</li>
        <li>짬뽕 8,000</li>
        <li>간자짱 9,000</li>
        <li>볶음밥 9,500</li>
    </ul>

    <!-- 순서 있는 목록(ol): 앞에 1,2,3... 같은 순번이 붙어요. type="A"는 순번을 A,B,C...알파벳으로 바꿔요. -->
    <h2>메뉴판</h2>
    <ol type="A">
        <li>자장면 7,000</li>
        <li>짬뽕 8,000</li>
        <li>간자짱 9,000</li>
        <li>볶음밥 9,500</li>
    </ol>

    <!-- 설명 목록(dl): "용어(dt) - 설명(dd)" 짝으로 묶고 싶을 때 사용해요. dt 하나에 dd는 여러 개 붙을 수 있어요. -->
    <dl>
        <dt>오전 메뉴판</dt>
        <dd>자장면 7,000</dd>
        <dd>짬뽕 8,000</dd>
        <dd>간자짱 9,000</dd>
        <dd>볶음밥 9,500</dd>

        <dt>오후 메뉴판</dt>
        <dd>탕수육 7,000</dd>
        <dd>양장피 8,000</dd>
        <dd>유린기 9,000</dd>
        <dd>술 9,500</dd>
    </dl>

</body>
</html>
