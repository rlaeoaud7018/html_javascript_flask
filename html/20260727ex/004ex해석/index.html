<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BACKGROUND IMAGE</title>

    <link href="./common.css" rel="stylesheet" type="text/css">
    <link href="./index.css" rel="stylesheet" type="text/css">

</head>
<body>

    <div id="wrap">
        <!-- 로고(사이트 이름) -->
        <div class="logo">
            OUR OFFICE
        </div>

        <!-- 상단 메뉴 -->
        <div class="menu">
            <ul>
                <li><a href="#none">menu01</a></li>
                <li><a href="#none">menu02</a></li>
                <li><a href="#none">menu03</a></li>
                <li><a href="#none">menu04</a></li>
                <li><a href="#none">menu05</a></li>
            </ul>
        </div>

        <!-- 큰 배너 이미지 -->
        <div class="main_banner">
            <a href="#none"><img src="./imgs/957-1250x500.jpg"></a>
        </div>

        <!-- 상품 소개 이미지 -->
        <div class="main_goods">
            <a href="#none"><img src="./imgs/67-1250x500.jpg"></a>
        </div>

        <!--
            div.bg_fixed: 이미지 태그(img) 대신 CSS 배경 이미지를 쓰는 영역이에요.
            스크롤을 내려도 이 배경 이미지는 화면에 고정되어 있어서(background-attachment: fixed),
            그 위/아래 콘텐츠가 지나가는 듯한 느낌(패럴랙스 효과)을 줘요.
        -->
        <div class="bg_fixed"></div>

        <div class="main_banner">
            <a href="#none"><img src="./imgs/208-1250x500.jpg"></a>
        </div>

        <div class="main_goods">
            <a href="#none"><img src="./imgs/1051-1250x500.jpg"></a>
        </div>
    </div>

</body>
</html>
