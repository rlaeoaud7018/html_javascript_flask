<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OnelineDiaryPjt</title>

    <link href="./css/common.css" rel="stylesheet" type="text/css">
    <link href="./css/index.css" rel="stylesheet" type="text/css">

    <link href="./index.js" rel="stylesheet" type="text/css">

</head>

<body>
    <div id="wrap">
        <!-- 제목 -->
    
        <div class="title_wrap">
            Oneline Diary
        </div>

        <!-- 메뉴 -->
        <div class="menu_wrap">
            <a class="sign_up" href="#none">sign_up></a>
            <a class="sign_in" href="#none">sign_in></a>
            <a class="sign_out" href="#none">sign_out></a>
            <a class="write" href="#none">write></a>
            <a class="list" href="#none">list></a>
        </div>
    
        <!-- 회원가입 화면 -->
        <div class="sign_up_wrap">
            <input type="text" name="u_id" placeholder="아이디 입력">
            <br>
            <input type="password" name="u_pw" placeholder="비밀번호 입력">
            <br>
            <input type="email" name="u_email" placeholder="이메일 입력">
            <br>
            <input type="button" value="sign up">
        </div>

        <!-- 회원가입 화면 -->
        <div class="sign_ip_wrap">
            <input type="text" name="u_id" placeholder="아이디 입력">
            <br>
            <input type="password" name="u_pw" placeholder="비밀번호 입력">
            <br>
            <input type="button" value="sign in">
        </div>

        




    </div>




</body>
</html>
